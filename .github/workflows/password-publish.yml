name: 管理员密码发布工作台
on:
  workflow_dispatch:
  push:
    paths: ['incoming/*.json', 'publisher-access.json']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: qimao-password-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 校验程序文件并在后台签名
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_PRIVATE_KEY: ${{ secrets.QIMAO_SIGNING_PRIVATE_KEY }}
        run: |
          if git diff-tree --no-commit-id --name-only -r HEAD | grep -q '^incoming/'; then
            python3 -B publisher/sign_incoming.py
          fi
      - name: 保存签名版本
        run: |
          git config user.name '七猫统一发布后台'
          git config user.email 'actions@users.noreply.github.com'
          git add packages channels/stable/latest.json index.html
          if ! git diff --cached --quiet; then
            git commit -m '管理员发布新版工作台'
            git push origin HEAD:main
          fi
          mkdir site
          cp -R packages channels index.html site/
          if [ -f publisher-access.json ]; then cp publisher-access.json site/; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: 部署免费更新站点
        id: deployment
        uses: actions/deploy-pages@v4
